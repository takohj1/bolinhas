name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/takohj1/bolinhas
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bolinhas Balalaescas"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.takohj1.bolinhas'
              compileSdk 34

              defaultConfig {
                  applicationId "com.takohj1.bolinhas"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="Bolinhas Balalaescas"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/takohj1/bolinhas/MainActivity.java
          package com.takohj1.bolinhas;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQ = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  );

                  WebView wv = new WebView(this);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  wv.addJavascriptInterface(new WebAppInterface(this), "Android");
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent intent = params.createIntent();
                          try {
                              startActivityForResult(intent, FILE_REQ);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  setContentView(wv);
                  wv.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCallback = null;
                  }
                  super.onActivityResult(req, res, data);
              }

              public static class WebAppInterface {
                  private final Context ctx;
                  WebAppInterface(Context c) { this.ctx = c; }

                  @JavascriptInterface
                  public void vib(String patternCsv, int amplitude) {
                      Vibrator v = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                      if (v == null || !v.hasVibrator()) return;
                      String[] parts = patternCsv.split(",");
                      if (parts.length == 1) {
                          long ms = Long.parseLong(parts[0].trim());
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              int amp = Math.max(1, Math.min(255, amplitude));
                              v.vibrate(VibrationEffect.createOneShot(ms, amp));
                          } else {
                              v.vibrate(ms);
                          }
                      } else {
                          long[] timings = new long[parts.length + 1];
                          timings[0] = 0;
                          for (int i = 0; i < parts.length; i++) {
                              timings[i + 1] = Long.parseLong(parts[i].trim());
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(timings, -1));
                          } else {
                              v.vibrate(timings, -1);
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper 8.9
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bolinhas-Balalaescas-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
