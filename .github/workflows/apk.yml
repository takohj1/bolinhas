name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Montar o projeto Android
        run: |
          test -f index.html || { echo "Falta o index.html na raiz do repositório"; exit 1; }
          mkdir -p app/src/main/assets app/src/main/java/com/takohaha22/ritmo app/src/main/res/values app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'FIM'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name='Ritmo'
          include ':app'
          FIM
          cat > build.gradle <<'FIM'
          plugins{id 'com.android.application' version '8.5.2' apply false}
          FIM
          cat > gradle.properties <<'FIM'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          FIM
          cat > app/build.gradle <<'FIM'
          plugins{id 'com.android.application'}
          android{namespace 'com.takohaha22.ritmo'
          compileSdk 34
          defaultConfig{applicationId 'com.takohaha22.ritmo'
          minSdk 26
          targetSdk 34
          versionCode 1
          versionName '1.0'}
          buildTypes{release{minifyEnabled false}}
          compileOptions{sourceCompatibility JavaVersion.VERSION_1_8
          targetCompatibility JavaVersion.VERSION_1_8}}
          FIM
          cat > app/src/main/AndroidManifest.xml <<'FIM'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="Bolinhas Balalaescas" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          FIM
          cat > app/src/main/res/values/colors.xml <<'FIM'
          <resources><color name="bg">#1A1535</color></resources>
          FIM
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'FIM'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/bg"/><foreground android:drawable="@drawable/fg"/></adaptive-icon>
          FIM
          cat > app/src/main/res/drawable/fg.xml <<'FIM'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#FF9FBD" android:pathData="M54,54m-16,0a16,16 0,1 1,32 0a16,16 0,1 1,-32 0"/>
          <path android:strokeColor="#FFD38A" android:strokeWidth="3" android:pathData="M54,54m-24,0a24,24 0,1 1,48 0a24,24 0,1 1,-48 0"/></vector>
          FIM
          cat > app/src/main/java/com/takohaha22/ritmo/MainActivity.java <<'FIM'
          package com.takohaha22.ritmo;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.*;

          public class MainActivity extends Activity {
            WebView w; ValueCallback<Uri[]> cb; Vibrator vb;

            class Bridge {
              @JavascriptInterface public void vib(String csv, int amp) {
                try {
                  if (vb == null || !vb.hasVibrator()) return;
                  String[] p = csv.split(",");
                  long[] t = new long[p.length + 1]; int[] a = new int[p.length + 1];
                  int level = Math.max(1, Math.min(255, amp));
                  for (int i = 0; i < p.length; i++) { t[i + 1] = Long.parseLong(p[i].trim()); a[i + 1] = (i % 2 == 0) ? level : 0; }
                  vb.vibrate(VibrationEffect.createWaveform(t, a, -1));
                } catch (Exception e) { }
              }
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              vb = (Vibrator) getSystemService(VIBRATOR_SERVICE);
              w = new WebView(this); setContentView(w); w.setBackgroundColor(0xFF1A1535);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false); s.setAllowFileAccess(true);
              w.addJavascriptInterface(new Bridge(), "Android");
              w.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> c, FileChooserParams p) {
                  if (cb != null) cb.onReceiveValue(null);
                  cb = c;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("audio/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  startActivityForResult(i, 1);
                  return true;
                }
              });
              w.loadUrl("file:///android_asset/index.html");
            }
            void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            @Override protected void onActivityResult(int r, int c, Intent d) {
              if (r == 1 && cb != null) { cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, d)); cb = null; }
            }
            @Override public void onBackPressed() { finish(); }
          }
          FIM
      - name: Compilar o APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk bolinhas-balalaescas.apk
      - name: Publicar o APK para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bolinhas Balalaescas v${{ github.run_number }}
          files: bolinhas-balalaescas.apk
