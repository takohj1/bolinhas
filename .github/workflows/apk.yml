name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/bolinhas/game
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bolinhas Balalaescas"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.bolinhas.game'
              compileSdk 34
              defaultConfig {
                  applicationId "com.bolinhas.game"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E1E2E"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FF4081"
                  android:pathData="M54,24A30,30 0 1,1 54,84A30,30 0 1,1 54,24Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Bolinhas Balalaescas"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/bolinhas/game/MainActivity.java
          package com.bolinhas.game;

          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private ActivityResultLauncher<Intent> fileChooserLauncher;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          try {
                              fileChooserLauncher.launch(intent);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new WebAppInterface(this), "Android");

                  fileChooserLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (filePathCallback == null) return;
                          Uri[] results = null;
                          if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                              Intent data = result.getData();
                              if (data.getDataString() != null) {
                                  results = new Uri[]{Uri.parse(data.getDataString())};
                              } else if (data.getClipData() != null) {
                                  ClipData clipData = data.getClipData();
                                  results = new Uri[clipData.getItemCount()];
                                  for (int i = 0; i < clipData.getItemCount(); i++) {
                                      results[i] = clipData.getItemAt(i).getUri();
                                  }
                              }
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  );

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class WebAppInterface {
                  AppCompatActivity mContext;

                  WebAppInterface(AppCompatActivity c) {
                      mContext = c;
                  }

                  @JavascriptInterface
                  public void vib(String csv, int amp) {
                      try {
                          Vibrator v = (Vibrator) mContext.getSystemService(VIBRATOR_SERVICE);
                          if (v == null || !v.hasVibrator()) return;
                          int safeAmp = Math.max(1, Math.min(255, amp));
                          String[] parts = (csv != null ? csv : "40").split(",");
                          if (parts.length <= 1) {
                              long dur = 40;
                              try { dur = Long.parseLong(parts[0].trim()); } catch (Exception ignored) {}
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createOneShot(Math.max(1, dur), safeAmp));
                              } else {
                                  v.vibrate(Math.max(1, dur));
                              }
                          } else {
                              long[] timings = new long[parts.length];
                              int[] amps = new int[parts.length];
                              for (int i = 0; i < parts.length; i++) {
                                  long t = 0;
                                  try { t = Long.parseLong(parts[i].trim()); } catch (Exception ignored) {}
                                  timings[i] = Math.max(0, t);
                                  amps[i] = (i % 2 == 0) ? safeAmp : 0;
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createWaveform(timings, amps, -1));
                              } else {
                                  v.vibrate(timings, -1);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk bolinhas-balalaescas.apk

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: bolinhas-balalaescas.apk
          tag_name: v1.0.apk
          name: Bolinhas Balalaescas v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
